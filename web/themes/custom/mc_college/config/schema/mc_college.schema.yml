# Schema for the configuration files of the MC College.
mc_college.settings:
  type: theme_settings
  label: "MC College settings"
  mapping:
    # Containers for regions.
    # ----------------------------
    container_header:
      type: string
      label: "Container for Header region"
    container_content:
      type: string
      label: "Container for Content region"
    container_footer:
      type: string
      label: "Container for Footer region"
